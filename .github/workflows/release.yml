name: release

# A release is built here, from the tag alone, and not on anyone's machine: the ZIP people download is
# made from the tagged tree by jobs whose whole input is public, and no personal credential touches it.
#
# Two jobs, split by privilege. `build` runs the tag's own code - its tests and tools/make_release.py -
# holding a read-only token it does not keep on disk. `publish` holds the rights to attest and to create
# the release, and runs none of the repository's code: it takes what `build` made, checks it again,
# attests it and publishes it. Every action is pinned by its full commit SHA - the pins the product's
# own workflows use - and nothing else is downloaded or installed.
on:
  push:
    tags: ["v*"]

# Nothing by default. Each job asks for exactly what it uses.
permissions: {}

# One release of a tag at a time, and never one cancelled half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The tool is Windows-only, and so are its tests.
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is for this checkout, not for whatever the checked-out code does next.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Work out the version
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The version names the ZIP, its folder and the release, and later steps read it: it is
          # checked here, once. tools/make_release.py refuses one that is not the tool's __version__.
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Run the tests
        # A tag is not a reason to skip them; it is the last moment they still help.
        run: python -m unittest discover -s tests

      - name: Build the ZIP
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Every entry carries the tagged commit's time, so the same tag gives the same bytes.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python tools/make_release.py --version "$VERSION" --out dist

      - name: Take the release notes from the tag's message
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The checkout made the tag point at the commit; the message lives in the tag object, so
          # fetch that one ref - anonymously, since the repository is public and no token was kept.
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          [[ "$(git cat-file -t "refs/tags/$TAG")" == "tag" ]] \
            || { echo "::error::$TAG is not an annotated tag, and its message is the release notes"; exit 1; }
          [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$GITHUB_SHA" ]] \
            || { echo "::error::$TAG no longer names the commit this run built"; exit 1; }
          git tag --list --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" > dist/release-notes.md
          [[ -n "$(tr -d '[:space:]' < dist/release-notes.md)" ]] || { echo "::error::$TAG has an empty message"; exit 1; }

      - name: Keep what was built for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build
          path: |
            dist/*.zip
            dist/*.sha256
            dist/release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # To create the release.
      contents: write
      # For build provenance: `attestations: write` records it, and `id-token: write` is how the runner
      # proves to the attestation service who it is.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      ZIP: dist/codex-compat-reporter-${{ needs.build.outputs.version }}.zip
    steps:
      # No checkout: nothing in this job runs the repository's code.
      - name: Take what the build job made
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build
          path: dist

      - name: Check it again, here
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version '$VERSION'"; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/v$VERSION" ]] || { echo "::error::$GITHUB_REF does not match v$VERSION"; exit 1; }
          recorded="$(cut -d' ' -f1 "$ZIP.sha256")"
          actual="$(sha256sum "$ZIP" | cut -d' ' -f1)"
          [[ "$recorded" == "$actual" ]] || { echo "::error::checksum mismatch: recorded $recorded, actual $actual"; exit 1; }
          # The six files a reporter needs, under one folder, in the order they were packed, and nothing else.
          folder="codex-compat-reporter-$VERSION"
          wanted="$(printf "$folder/%s\n" codex_compat_report.py Report.cmd README.md README.ko.md LICENSE docs/REPORT_FORMAT.md)"
          listed="$(unzip -Z1 "$ZIP")"
          [[ "$listed" == "$wanted" ]] || { echo "::error::the ZIP holds something else:"; echo "$listed"; exit 1; }
          echo "$ZIP verified: $actual"

      # Build provenance, so a downloaded ZIP can be traced to this run and the commit it was built
      # from. Before publication: a ZIP that cannot be attested does not become a release.
      - name: Attest the ZIP
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ZIP }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # --verify-tag: publish only a tag that is on GitHub, never make one.
          gh release create "v$VERSION" "$ZIP" "$ZIP.sha256" --verify-tag \
            --title "codex-compat-reporter $VERSION" --notes-file dist/release-notes.md
